# SmartCam backend — Fly.io configuration (deploys the CI-built GHCR image).
#
# One-time setup:
#   fly auth login
#   fly apps create smartcam
#   fly volumes create smartcam_data --size 1 --region lhr
#   fly deploy
#
# Replace <owner> in [build].image with your GitHub username.
# Give the machine enough RAM for PyTorch:  fly scale memory 2048

app = "smartcam"
primary_region = "lhr"   # London — closest good region to Nigeria

[build]
  image = "ghcr.io/<owner>/smartcam:latest"

[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 1

[env]
  PORT = "8000"

[[mounts]]
  source = "smartcam_data"
  destination = "/app/data"

name: Docker build + smoke test

# Builds the SmartCam Docker image and smoke-tests it (container starts and
# serves /api/health). This is the "Docker build test" that works without a
# local Docker install, and doubles as the deploy pipeline (pushes to GHCR on
# main).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to GHCR

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smartcam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start container + hit /api/health)
        run: |
          docker run -d --name smartcam -p 8000:8000 -e PORT=8000 smartcam:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then
              echo
              echo "HEALTH OK"
              exit 0
            fi
            sleep 3
          done
          echo "Health check timed out" >&2
          docker logs smartcam
          exit 1

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smartcam:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

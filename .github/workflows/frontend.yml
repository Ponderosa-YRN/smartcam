name: Frontend build

# Production is served from the VPS (Caddy -> Next.js on :3000); deploys happen with
# scripts/deploy_web.sh on the server. This workflow is the build safety net only: it
# catches type/compile errors before they can reach production. No NEXT_PUBLIC_API_URL
# is set, so the build uses the same same-origin /smartapi default as production.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (next build)
        working-directory: frontend
        run: npm run build

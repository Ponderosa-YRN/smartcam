name: Frontend build + deploy

# Builds the Next.js app (next build) and deploys it to Vercel on main.
# This runs the real production build — the step that can't run in this dev
# sandbox — so it's also the frontend's "build test".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (next build)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://smartcam-api.fly.dev' }}

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main'
        working-directory: frontend
        run: npx vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
